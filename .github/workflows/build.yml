name: Build and test distributions

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [tan, master, main, tidy]
    tags: ['v[0-9]*', 'v__*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Build the source distribution from the clean checkout
        run: |
          python -m pip install build twine
          python -m build --sdist
          python -m twine check --strict dist/*
      - name: Check the release tag against package metadata
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python - <<'PY'
          import email
          import os
          from pathlib import Path
          import tarfile

          archive, = Path("dist").glob("*.tar.gz")
          with tarfile.open(archive) as source:
              metadata = email.message_from_binary_file(source.extractfile(f"{archive.name[:-7]}/PKG-INFO"))
          tag = os.environ["GITHUB_REF_NAME"]
          prefix = "v__" if tag.startswith("v__") else "v"
          if tag != prefix + metadata["Version"]:
              raise SystemExit(f"Tag {tag} does not match package version {metadata['Version']}")
          PY
          if [[ "${GITHUB_REF_NAME}" != v__* ]]; then
            git merge-base --is-ancestor HEAD "refs/remotes/origin/${DEFAULT_BRANCH}"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-source
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
        python: ['311', '312', '313', '314']
        exclude:
          - os: macos-15-intel
            python: '314' # Numba has no compatible Intel macOS build.
    runs-on: ${{ matrix.os }}
    env:
      CIBW_BUILD: 'cp${{ matrix.python }}-*'
      CIBW_ARCHS: native
      CIBW_SKIP: '*-musllinux_*'
      CIBW_BUILD_FRONTEND: 'build[uv]'
      CIBW_TEST_REQUIRES: pip
      CIBW_TEST_COMMAND: >-
        python -m pip check &&
        python -m unittest -f snipar.tests.test_impute_from_sibs
        snipar.tests.test_impute.TestImpute.test_impute_with_phased_pedigree_control &&
        python -m snipar.scripts.correlate --help &&
        python -m snipar.scripts.pgs --help
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-source
          path: dist
      - name: Extract the source distribution
        shell: bash
        run: |
          mkdir source
          tar -xzf dist/snipar-*.tar.gz --strip-components=1 -C source
      - name: Set up the native macOS OpenMP runtime
        if: runner.os == 'macOS'
        run: |
          brew install libomp
          prefix="$(brew --prefix libomp)"
          target="$(xcrun vtool -show-build "$prefix/lib/libomp.dylib" | awk '$1 == "minos" {print $2; exit}')"
          test -n "$target"
          echo "SNIPAR_OPENMP_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=$target" >> "$GITHUB_ENV"
      - uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        with:
          extras: uv
          package-dir: source
          output-dir: wheelhouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.os }}-cp${{ matrix.python }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  regressions:
    needs: wheels
    runs-on: ubuntu-24.04
    env:
      NUMBA_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Check distributions and install the built Linux wheel
        run: |
          python -m pip install pytest twine dist/snipar-*-cp311-*-manylinux*x86_64.whl
          python -m twine check --strict dist/*
          python -m pip check
      - name: Summarize distributions and check release storage
        env:
          INDEX_HOST: ${{ github.event_name == 'push' && github.ref_type == 'tag' && (startsWith(github.ref_name, 'v__') && 'test.pypi.org' || 'pypi.org') || '' }}
          PYPI_PROJECT_LIMIT_BYTES: ${{ vars.PYPI_PROJECT_LIMIT_BYTES }}
          TESTPYPI_PROJECT_LIMIT_BYTES: ${{ vars.TESTPYPI_PROJECT_LIMIT_BYTES }}
          INDEX_JSON: ${{ runner.temp }}/snipar-index.json
        run: |
          if [[ -n "$INDEX_HOST" ]]; then
            status=$(curl --silent --show-error --retry 3 --connect-timeout 15 --max-time 60 \
              --header 'Accept: application/vnd.pypi.simple.v1+json' --output "$INDEX_JSON" \
              --write-out '%{http_code}' "https://$INDEX_HOST/simple/snipar/")
            case "$status" in
              200) ;;
              404) echo '{"files":[]}' > "$INDEX_JSON" ;;
              *) echo "Package index returned HTTP $status" >&2; exit 1 ;;
            esac
          fi
          python .github/scripts/check_distribution_size.py
      - name: Run native unit and example tests from the installation
        working-directory: ${{ runner.temp }}
        run: python -m unittest -f snipar.tests
      - name: Run Python statistical and CLI regressions
        working-directory: ${{ runner.temp }}
        run: python -m pytest -x "$GITHUB_WORKSPACE/tests"
      - name: Run binary PGS regressions
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends r-base-core r-cran-lme4 r-cran-numderiv plink1.9 bsdextrautils
          Rscript snipar/tests/test_pgs_binary.R
      - name: Run the documented tutorial and simulation commands
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p tutorial-bin
          ln -s "$(command -v plink1.9)" tutorial-bin/plink
          PATH="$PWD/tutorial-bin:$PATH" python "$GITHUB_WORKSPACE/tests/run_documented_examples.py"
      - name: Build documentation
        run: |
          python -m pip install -r docs/requirements.txt
          python -m sphinx -b html -W --keep-going docs docs/_build/html

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: regressions
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    environment:
      name: ${{ startsWith(github.ref_name, 'v__') && 'testpypi' || 'pypi' }}
      url: ${{ startsWith(github.ref_name, 'v__') && 'https://test.pypi.org/p/snipar' || 'https://pypi.org/p/snipar' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
          repository-url: ${{ startsWith(github.ref_name, 'v__') && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
